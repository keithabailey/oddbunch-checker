[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oddbunch"
version = "0.1.0"
description = "Weekly Odd Bunch box check: flag unwanted items and prefill the substitution form."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "ruamel.yaml>=0.18",
  "click>=8.1",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oddbunch = "oddbunch.cli:main"

[tool.setuptools]
packages = ["oddbunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
